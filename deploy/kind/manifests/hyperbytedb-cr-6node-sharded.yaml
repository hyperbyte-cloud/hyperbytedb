# HyperbyteDB 6-node sharded test cluster — 1 CPU / 4 GiB per pod, proxy disabled.
# Sharding is declared on spec.sharding; the operator writes [sharding] to config.toml.
# Clean redeploy: deploy/kind/setup.sh hdb-reset --sharded
apiVersion: hyperbytedb.hyperbyte.cloud/v1alpha1
kind: HyperbytedbCluster
metadata:
  name: hyperbytedb
  namespace: hyperbytedb
spec:
  replicas: 6
  image: hyperbytedb:local
  imagePullPolicy: Never
  server:
    port: 8086
    maxBodySizeBytes: 26214400
    requestTimeoutSecs: 30
    queryTimeoutSecs: 30
    maxConcurrentQueries: 8
  storage:
    volumeClaimTemplate:
      size: 16Gi
  chdb:
    poolSize: 1
  flush:
    intervalSecs: 5
    maxPointsPerBatch: 100000
    walBatchSize: 128
    walBatchDelayUs: 0
  retention:
    enabled: true
    interval: 12h
  cardinality:
    maxTagValuesPerMeasurement: 200000
    maxMeasurementsPerDatabase: 10000
  cluster:
    heartbeatIntervalSecs: 2
    heartbeatMissThreshold: 5
    replicationMaxRetries: 5
    replicationQueueDepth: 8192
    replicationMaxInflightBatches: 4
    replicationMaxCoalesceBodyBytes: 8388608
    replicateReceiverQueueDepth: 1024
    replicationTruncateStalePeerMultiplier: 2
    raftHeartbeatIntervalMs: 1000
    raftElectionTimeoutMs: 5000
    raftSnapshotThreshold: 1000
    drainWaitSecs: 30
    replication:
      mode: async
      ackTimeoutMs: 5000
      syncQuorum:
        minAcks: majority
  statementSummary:
    enabled: true
    maxEntries: 1000
  hintedHandoff:
    enabled: true
    maxHintsPerPeer: 100000
    maxHintAgeSecs: 3600
  rateLimit:
    enabled: false
    maxRequestsPerSecond: 0
  logging:
    level: info
    format: json
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "1"
      memory: 4Gi
  proxy:
    enabled: false
  sharding:
    enabled: true
    replicationFactor: 2
    regionSplitSeries: 25
    regionMaxSeries: 40
    regionMergeSeries: 2
    splitMergeIntervalSecs: 30
    scheduleLimit: 4
    heartbeatIntervalSecs: 10
    bootstrapTimeoutMs: 5000
    loadSplitQpsThreshold: 0
